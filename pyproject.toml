[project]
name = "app-scout"
version = "0.1.0"
description = "競合アプリのレビューから不満を集め、企画書の下書きを作るエージェント"
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.162.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]
